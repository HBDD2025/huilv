name: 更新用卡助手官方来源
on:
  push:
    branches: [main]
    paths:
      - 'cards/data/cards.json'
      - 'cards/data/hk-cards.json'
      - 'cards/data/decision-rules.json'
      - 'cards/web/decision.js'
      - '.github/workflows/update-cards.yml'
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: card-guide-source-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sources and validate
        working-directory: cards
        run: |
          python3 scripts/check_sources.py
          python3 scripts/validate.py
          node scripts/test_recommend.cjs
          node scripts/test_decision.cjs
          python3 scripts/build.py
      - name: Save source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/data/source-status.json cards/data/monitor-summary.md cards/index.html
          if ! git diff --cached --quiet; then
            git commit -m "更新用卡助手官方来源巡检状态"
            git pull --rebase origin main
            git push
          fi
      - name: Request existing branch-based GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
